<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password · 6wforever</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <main class="auth-card">
        <div class="brand-mark">6w</div>
        <h1>Reset password</h1>

        <p class="muted">
            Answer your security question to choose a new password.
        </p>

        {% if error %}
            <div class="notice error">{{ error }}</div>
        {% endif %}

        {% if not question %}
            <form method="post" class="auth-form">
                <input type="hidden" name="action" value="lookup">

                <label for="username">Username</label>
                <input
                    id="username"
                    name="username"
                    minlength="3"
                    maxlength="24"
                    value="{{ username }}"
                    autocomplete="username"
                    required
                >

                <button class="primary full">Find my question</button>
            </form>
        {% else %}
            <form method="post" class="auth-form">
                <input type="hidden" name="action" value="reset">
                <input type="hidden" name="username" value="{{ username }}">

                <p><strong>Username:</strong> {{ username }}</p>
                <p><strong>Security question:</strong> {{ question }}</p>

                <label for="security_answer">Your answer</label>
                <input
                    id="security_answer"
                    name="security_answer"
                    minlength="2"
                    maxlength="100"
                    autocomplete="off"
                    required
                >

                <label for="new_password">New password</label>
                <input
                    id="new_password"
                    name="new_password"
                    type="password"
                    minlength="8"
                    maxlength="128"
                    autocomplete="new-password"
                    required
                >

                <button class="primary full">Reset password</button>
            </form>
        {% endif %}

        <p class="switch">
            <a href="{{ url_for('login') }}">Back to log in</a>
        </p>
    </main>
</body>
</html>
